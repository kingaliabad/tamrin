name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk hamrah-tamrin.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-tamrin-apk
          path: hamrah-tamrin.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hamrah Tamrin - build ${{ github.run_number }}
          files: hamrah-tamrin.apk
